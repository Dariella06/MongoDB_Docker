services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-botiga
    # Aqui tenemos el puerto que se conectara el host al contenedor
    ports:
      - "27017:27017"
    
    # Aqui tenemos el username y el password para el mongodb de la sesion
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - ./data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d

    networks:
      - xarxa-botiga

  mongo-express:
    image: mongo-express:1.0
    container_name: mongoexpress-botiga

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/

    depends_on:
      - mongodb

    restart: unless-stopped

    networks:
      - xarxa-botiga

networks:
  xarxa-botiga:
    driver: bridge